name: Build Rewind

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare the capture engine
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipSdk
      - name: Build and run checks
        shell: pwsh
        run: ./scripts/build.ps1 -OfficialRelease -OutputDirectory ./dist/Rewind
      - name: Verify replay exports and Discord IPC
        shell: pwsh
        run: ./scripts/verify.ps1
